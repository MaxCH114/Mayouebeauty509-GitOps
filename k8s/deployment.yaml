apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayouebeauty509-app
  namespace: mayouebeauty509
spec:
  replicas:3
  selector:
    matchLabels:
      app: mayouebeauty509-app
  template:
    metadata:
      labels:
        app: mayouebeauty509-app
    spec:
      containers:
        - name: app
          image: pmchamblain/mayouebeauty509-app:v3
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              protocol: TCP

          env:
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/mayouebeauty509

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mayouebeauty509-secrets
                  key: JWT_SECRET

            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mayouebeauty509-secrets
                  key: NEXTAUTH_SECRET

            - name: NEXT_PUBLIC_API_URL
              value: http://192.168.254.195:30080

            - name: NEXTAUTH_URL
              value: http://192.168.254.195:30080

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
